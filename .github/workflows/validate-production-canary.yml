name: TRACE production canary

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit SHA to validate or deploy
        required: true
        type: string
      mode:
        description: Validate the canary artifact or deploy after provisioning
        required: true
        default: validate-only
        type: choice
        options:
          - validate-only
          - deploy
      runtime_mode:
        description: Effective production Worker runtime mode; fixture requires its distinct deploy confirmation
        required: true
        default: closed
        type: choice
        options:
          - closed
          - fixture
          - owner
      d1_baseline_stage:
        description: Verified existing D1 state to preserve across deployment
        required: true
        default: before-oauth
        type: choice
        options:
          - before-oauth
          - after-onboarding
          - after-live-issue
          - owner
      confirmation:
        description: Type the confirmation required for the selected deploy runtime mode
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: trace-production-canary
  cancel-in-progress: false

jobs:
  canary:
    if: ${{ github.ref == 'refs/heads/feat/cloudflare-native-runtime' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production-canary
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TRACE_PRODUCTION_D1_ID: ${{ vars.TRACE_PRODUCTION_D1_ID }}
      TRACE_PRODUCTION_QUEUE_NAME: ${{ vars.TRACE_PRODUCTION_QUEUE_NAME }}
      TRACE_PRODUCTION_WORKER_NAME: ${{ vars.TRACE_PRODUCTION_WORKER_NAME }}
      DEPLOYMENT_ACTION: ${{ inputs.mode }}
      TRACE_FIXTURE_D1_BASELINE_STAGE: ${{ inputs.d1_baseline_stage }}
      RUNTIME_MODE: ${{ inputs.runtime_mode }}
      PRODUCTION_INSTALLATION_POLICY: ${{ inputs.runtime_mode }}
      EXPECTED_SHA: ${{ inputs.sha }}
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The requested source must be a full 40-character hexadecimal commit SHA." >&2
            exit 1
          fi
          case "$DEPLOYMENT_ACTION" in
            validate-only|deploy) ;;
            *)
              echo "Unsupported canary mode." >&2
              exit 1
              ;;
          esac
          case "$RUNTIME_MODE" in
            closed|fixture|owner) ;;
            *)
              echo "Unsupported production runtime mode." >&2
              exit 1
              ;;
          esac

      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source and mode
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="${EXPECTED_SHA,,}"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "Checked-out SHA does not match the requested source." >&2
            exit 1
          fi
          pnpm exec tsx scripts/production-canary-deploy-contract.ts
          echo "Source SHA: $actual_sha"
          echo "Deployment action: $DEPLOYMENT_ACTION"
          echo "Runtime mode: $RUNTIME_MODE"

      - name: Build workspace packages
        run: pnpm build

      - name: Build the Cloudflare bundle
        run: pnpm cf:build

      - name: Generate Cloudflare worker types
        working-directory: apps/web
        run: |
          pnpm exec wrangler types --config wrangler.jsonc --env staging --strict-vars=false worker-configuration.d.ts
          test -s worker-configuration.d.ts

      - name: Typecheck the generated Cloudflare entrypoint
        run: >-
          pnpm exec tsc --noEmit --strict --allowJs --skipLibCheck --module ESNext
          --moduleResolution Bundler --target ES2022 --esModuleInterop
          --allowSyntheticDefaultImports apps/web/worker-configuration.d.ts
          apps/web/custom-worker.ts apps/worker/src/cloudflare.ts

      - name: Validate the bundled Worker artifact
        env:
          BUNDLE_DIR: ${{ runner.temp }}/trace-production-canary-bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR"
          pnpm exec wrangler deploy \
            --config apps/web/wrangler.jsonc \
            --env staging \
            --dry-run \
            --outdir "$BUNDLE_DIR" \
            --metafile "$BUNDLE_DIR/bundle-meta.json" > "$BUNDLE_DIR/wrangler-dry-run.log"
          test -s "$BUNDLE_DIR/custom-worker.js"
          node --check "$BUNDLE_DIR/custom-worker.js"
          test -d apps/web/.open-next/assets
          test -n "$(find apps/web/.open-next/assets -type f -print -quit)"
          echo "Bundled Worker artifact is executable."

      - name: Run production canary preflight
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/production-canary-preflight.ts \
            --mode validate-only \
            --runtime-mode "$RUNTIME_MODE" \
            --bundle-entry "$BUNDLE_DIR/custom-worker.js" \
            --assets-dir apps/web/.open-next/assets
        env:
          BUNDLE_DIR: ${{ runner.temp }}/trace-production-canary-bundle

      - name: Validate provisioned production identity
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Deploy mode requires the production-canary Cloudflare credentials." >&2
            exit 1
          fi
          if [[ -z "${TRACE_PRODUCTION_D1_ID:-}" || -z "${TRACE_PRODUCTION_QUEUE_NAME:-}" || -z "${TRACE_PRODUCTION_WORKER_NAME:-}" ]]; then
            echo "Deploy mode requires provisioned production resource variables." >&2
            exit 1
          fi

      - name: Materialize production Wrangler config
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/production-canary-preflight.ts \
            --mode deploy \
            --runtime-mode "$RUNTIME_MODE" \
            --production-d1-id "$TRACE_PRODUCTION_D1_ID" \
            --production-queue-name "$TRACE_PRODUCTION_QUEUE_NAME" \
            --production-worker-name "$TRACE_PRODUCTION_WORKER_NAME" \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --bundle-entry "$BUNDLE_DIR/custom-worker.js" \
            --assets-dir apps/web/.open-next/assets \
            --write-config apps/web/.trace-cache/production-canary/wrangler.json
          test -s apps/web/.trace-cache/production-canary/wrangler.json
        env:
          BUNDLE_DIR: ${{ runner.temp }}/trace-production-canary-bundle
          TRACE_GITHUB_APP_ID: ${{ vars.TRACE_GITHUB_APP_ID }}
          TRACE_GITHUB_APP_CLIENT_ID: ${{ vars.TRACE_GITHUB_APP_CLIENT_ID }}
          TRACE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TRACE_GITHUB_APP_PRIVATE_KEY }}
          TRACE_GITHUB_APP_SLUG: ${{ vars.TRACE_GITHUB_APP_SLUG }}
          TRACE_GITHUB_APP_CALLBACK_URL: ${{ vars.TRACE_GITHUB_APP_CALLBACK_URL }}
          TRACE_GITHUB_APP_INSTALL_URL: ${{ vars.TRACE_GITHUB_APP_INSTALL_URL }}
          TRACE_GITHUB_OAUTH_CLIENT_ID: ${{ vars.TRACE_GITHUB_OAUTH_CLIENT_ID }}

      - name: Verify production GitHub App identity
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: pnpm exec tsx scripts/verify-production-github-app.ts
        env:
          TRACE_GITHUB_APP_ID: ${{ vars.TRACE_GITHUB_APP_ID }}
          TRACE_GITHUB_APP_CLIENT_ID: ${{ vars.TRACE_GITHUB_APP_CLIENT_ID }}
          TRACE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TRACE_GITHUB_APP_PRIVATE_KEY }}

      - name: Verify authorized existing fixture installation or initial uninstalled App
        if: ${{ inputs.mode == 'deploy' && (inputs.runtime_mode == 'fixture' || inputs.runtime_mode == 'owner') }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TRACE_FIXTURE_D1_BASELINE_STAGE" == after-onboarding || "$TRACE_FIXTURE_D1_BASELINE_STAGE" == after-live-issue || "$TRACE_FIXTURE_D1_BASELINE_STAGE" == owner ]]; then
            pnpm exec tsx scripts/verify-production-github-fixture-installation.ts
          else
            pnpm exec tsx scripts/verify-production-github-app-state.ts
          fi
        env:
          TRACE_GITHUB_APP_ID: ${{ vars.TRACE_GITHUB_APP_ID }}
          TRACE_GITHUB_APP_CLIENT_ID: ${{ vars.TRACE_GITHUB_APP_CLIENT_ID }}
          TRACE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TRACE_GITHUB_APP_PRIVATE_KEY }}

      # The application remains the exact inputs.sha build. Operational guards must
      # come from the reviewed workflow ref, whose registry can include newer baselines.
      - name: Check out reviewed production verification tooling
        if: ${{ inputs.mode == 'deploy' && (inputs.runtime_mode == 'fixture' || inputs.runtime_mode == 'owner') }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .trace-cache/production-verifier
          fetch-depth: 1
          persist-credentials: false

      - name: Verify operational source identity and application ancestry
        if: ${{ inputs.mode == 'deploy' && (inputs.runtime_mode == 'fixture' || inputs.runtime_mode == 'owner') }}
        shell: bash
        env:
          VERIFIER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_verifier_sha="$(git -C .trace-cache/production-verifier rev-parse HEAD)"
          [[ "$actual_verifier_sha" == "$VERIFIER_SHA" ]]
          git merge-base --is-ancestor "$EXPECTED_SHA" "$VERIFIER_SHA"
          echo "PRODUCTION_VERIFIER_SOURCE_SHA=$actual_verifier_sha"
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_SHA,,}" ]]

      - name: Capture verified production baseline before fixture deployment
        if: ${{ inputs.mode == 'deploy' && (inputs.runtime_mode == 'fixture' || inputs.runtime_mode == 'owner') }}
        id: capture_transition_baseline
        shell: bash
        run: pnpm exec tsx .trace-cache/production-verifier/scripts/verify-production-fixture-transition.ts before --capture-baseline-outputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRACE_GITHUB_APP_ID: ${{ vars.TRACE_GITHUB_APP_ID }}
          TRACE_GITHUB_APP_CLIENT_ID: ${{ vars.TRACE_GITHUB_APP_CLIENT_ID }}
          TRACE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TRACE_GITHUB_APP_PRIVATE_KEY }}
          TRACE_GITHUB_APP_SLUG: ${{ vars.TRACE_GITHUB_APP_SLUG }}
          TRACE_GITHUB_APP_CALLBACK_URL: ${{ vars.TRACE_GITHUB_APP_CALLBACK_URL }}
          TRACE_GITHUB_APP_INSTALL_URL: ${{ vars.TRACE_GITHUB_APP_INSTALL_URL }}
          TRACE_GITHUB_OAUTH_CLIENT_ID: ${{ vars.TRACE_GITHUB_OAUTH_CLIENT_ID }}

      - name: Inspect existing production Worker secret names
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          metadata_file="$RUNNER_TEMP/trace-production-worker-secrets-before-$$.json"
          trap 'rm -f -- "$metadata_file"' EXIT
          pnpm exec wrangler secret list \
            --config apps/web/.trace-cache/production-canary/wrangler.json \
            --env production > "$metadata_file"
          pnpm exec tsx scripts/verify-production-worker-secrets.ts \
            --phase before \
            --input "$metadata_file"
          rm -f -- "$metadata_file"
          test ! -e "$metadata_file"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Production Wrangler dry run
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d "$RUNNER_TEMP/trace-production-secrets.XXXXXX")"
          secrets_file="$secret_dir/secrets.json"
          cleanup() {
            local status=$?
            trap - EXIT
            rm -f -- "$secrets_file"
            rmdir -- "$secret_dir" 2>/dev/null || true
            if [[ -e "$secrets_file" ]]; then
              echo "Temporary Worker secrets file cleanup failed." >&2
              status=1
            else
              echo "Temporary Worker secrets file cleaned."
            fi
            exit "$status"
          }
          trap cleanup EXIT
          pnpm exec tsx scripts/production-canary-secrets.ts --output "$secrets_file"
          pnpm exec wrangler deploy \
            --config apps/web/.trace-cache/production-canary/wrangler.json \
            --env production \
            --dry-run \
            --secrets-file "$secrets_file" \
            --outdir "$RUNNER_TEMP/trace-production-canary-production-bundle"
        env:
          TRACE_GITHUB_APP_CLIENT_SECRET: ${{ secrets.TRACE_GITHUB_APP_CLIENT_SECRET }}
          TRACE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TRACE_GITHUB_APP_PRIVATE_KEY }}
          TRACE_GITHUB_WEBHOOK_SECRET: ${{ secrets.TRACE_GITHUB_WEBHOOK_SECRET }}
          TRACE_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.TRACE_GITHUB_OAUTH_CLIENT_SECRET }}
          TRACE_AUTH_SECRET: ${{ secrets.TRACE_AUTH_SECRET }}

      - name: Deploy production canary
        if: ${{ inputs.mode == 'deploy' }}
        id: deploy_worker
        shell: bash
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
          RUNTIME_MODE: ${{ inputs.runtime_mode }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRACE_GITHUB_APP_CLIENT_SECRET: ${{ secrets.TRACE_GITHUB_APP_CLIENT_SECRET }}
          TRACE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TRACE_GITHUB_APP_PRIVATE_KEY }}
          TRACE_GITHUB_WEBHOOK_SECRET: ${{ secrets.TRACE_GITHUB_WEBHOOK_SECRET }}
          TRACE_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.TRACE_GITHUB_OAUTH_CLIENT_SECRET }}
          TRACE_AUTH_SECRET: ${{ secrets.TRACE_AUTH_SECRET }}
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d "$RUNNER_TEMP/trace-production-secrets.XXXXXX")"
          secrets_file="$secret_dir/secrets.json"
          cleanup() {
            local status=$?
            trap - EXIT
            rm -f -- "$secrets_file"
            rmdir -- "$secret_dir" 2>/dev/null || true
            if [[ -e "$secrets_file" ]]; then
              echo "Temporary Worker secrets file cleanup failed." >&2
              status=1
            else
              echo "Temporary Worker secrets file cleaned."
            fi
            exit "$status"
          }
          trap cleanup EXIT
          pnpm exec tsx scripts/production-canary-secrets.ts --output "$secrets_file"
          test -f "$secrets_file"
          pnpm exec wrangler deploy \
            --config apps/web/.trace-cache/production-canary/wrangler.json \
            --env production \
            --secrets-file "$secrets_file" \
            --message "TRACE production canary $DEPLOY_SHA"

      - name: Capture deployed fixture identity before acceptance probes
        if: ${{ inputs.mode == 'deploy' && (inputs.runtime_mode == 'fixture' || inputs.runtime_mode == 'owner') }}
        id: capture_fixture_identity
        shell: bash
        run: pnpm exec tsx .trace-cache/production-verifier/scripts/verify-production-fixture-transition.ts after --capture-deployment-outputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SHA: ${{ inputs.sha }}
          TRACE_BASELINE_WORKER_VERSION_ID: ${{ steps.capture_transition_baseline.outputs.baseline_worker_version_id }}
          TRACE_BASELINE_RUNTIME_MODE: ${{ steps.capture_transition_baseline.outputs.baseline_mode }}
          TRACE_GITHUB_APP_ID: ${{ vars.TRACE_GITHUB_APP_ID }}
          TRACE_GITHUB_APP_CLIENT_ID: ${{ vars.TRACE_GITHUB_APP_CLIENT_ID }}
          TRACE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TRACE_GITHUB_APP_PRIVATE_KEY }}
          TRACE_GITHUB_APP_SLUG: ${{ vars.TRACE_GITHUB_APP_SLUG }}
          TRACE_GITHUB_APP_CALLBACK_URL: ${{ vars.TRACE_GITHUB_APP_CALLBACK_URL }}
          TRACE_GITHUB_APP_INSTALL_URL: ${{ vars.TRACE_GITHUB_APP_INSTALL_URL }}
          TRACE_GITHUB_OAUTH_CLIENT_ID: ${{ vars.TRACE_GITHUB_OAUTH_CLIENT_ID }}

      - name: Verify deployed production Worker secret names
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          metadata_file="$RUNNER_TEMP/trace-production-worker-secrets-after-$$.json"
          trap 'rm -f -- "$metadata_file"' EXIT
          pnpm exec wrangler secret list \
            --config apps/web/.trace-cache/production-canary/wrangler.json \
            --env production > "$metadata_file"
          pnpm exec tsx scripts/verify-production-worker-secrets.ts \
            --phase after \
            --input "$metadata_file"
          rm -f -- "$metadata_file"
          test ! -e "$metadata_file"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record Wrangler version for bounded tail diagnostics
        if: ${{ inputs.mode == 'deploy' && (inputs.runtime_mode == 'fixture' || inputs.runtime_mode == 'owner') }}
        id: tail_wrangler_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(pnpm exec wrangler --version | pnpm exec tsx scripts/production-fixture-tail-acceptance.ts normalize-version)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'WRANGLER_VERSION=%s\n' "$version"

      - name: Verify fixture routes and bounded production error tail
        if: ${{ inputs.mode == 'deploy' && (inputs.runtime_mode == 'fixture' || inputs.runtime_mode == 'owner') }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_VERSION_ID: ${{ steps.capture_fixture_identity.outputs.worker_version_id }}
          WRANGLER_VERSION: ${{ steps.tail_wrangler_version.outputs.version }}
          TRACE_GITHUB_OAUTH_CLIENT_ID: ${{ vars.TRACE_GITHUB_OAUTH_CLIENT_ID }}
        run: pnpm exec tsx scripts/production-fixture-tail-acceptance.ts

      - name: Verify fixture transition side effects after acceptance probes
        if: ${{ inputs.mode == 'deploy' && (inputs.runtime_mode == 'fixture' || inputs.runtime_mode == 'owner') }}
        shell: bash
        run: pnpm exec tsx .trace-cache/production-verifier/scripts/verify-production-fixture-transition.ts after
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SHA: ${{ inputs.sha }}
          TRACE_BASELINE_WORKER_VERSION_ID: ${{ steps.capture_transition_baseline.outputs.baseline_worker_version_id }}
          TRACE_BASELINE_RUNTIME_MODE: ${{ steps.capture_transition_baseline.outputs.baseline_mode }}
          TRACE_GITHUB_APP_ID: ${{ vars.TRACE_GITHUB_APP_ID }}
          TRACE_GITHUB_APP_CLIENT_ID: ${{ vars.TRACE_GITHUB_APP_CLIENT_ID }}
          TRACE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TRACE_GITHUB_APP_PRIVATE_KEY }}
          TRACE_GITHUB_APP_SLUG: ${{ vars.TRACE_GITHUB_APP_SLUG }}
          TRACE_GITHUB_APP_CALLBACK_URL: ${{ vars.TRACE_GITHUB_APP_CALLBACK_URL }}
          TRACE_GITHUB_APP_INSTALL_URL: ${{ vars.TRACE_GITHUB_APP_INSTALL_URL }}
          TRACE_GITHUB_OAUTH_CLIENT_ID: ${{ vars.TRACE_GITHUB_OAUTH_CLIENT_ID }}

      - name: Inspect and safely roll back a failed fixture transition
        if: ${{ failure() && inputs.mode == 'deploy' && (inputs.runtime_mode == 'fixture' || inputs.runtime_mode == 'owner') && steps.capture_transition_baseline.outcome == 'success' }}
        shell: bash
        run: pnpm exec tsx .trace-cache/production-verifier/scripts/verify-production-fixture-transition.ts rollback-if-needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SHA: ${{ inputs.sha }}
          TRACE_BASELINE_WORKER_VERSION_ID: ${{ steps.capture_transition_baseline.outputs.baseline_worker_version_id }}
          TRACE_BASELINE_RUNTIME_MODE: ${{ steps.capture_transition_baseline.outputs.baseline_mode }}
          TRACE_GITHUB_APP_ID: ${{ vars.TRACE_GITHUB_APP_ID }}
          TRACE_GITHUB_APP_CLIENT_ID: ${{ vars.TRACE_GITHUB_APP_CLIENT_ID }}
          TRACE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TRACE_GITHUB_APP_PRIVATE_KEY }}
          TRACE_GITHUB_APP_SLUG: ${{ vars.TRACE_GITHUB_APP_SLUG }}
          TRACE_GITHUB_APP_CALLBACK_URL: ${{ vars.TRACE_GITHUB_APP_CALLBACK_URL }}
          TRACE_GITHUB_APP_INSTALL_URL: ${{ vars.TRACE_GITHUB_APP_INSTALL_URL }}
          TRACE_GITHUB_OAUTH_CLIENT_ID: ${{ vars.TRACE_GITHUB_OAUTH_CLIENT_ID }}
