name: TRACE production fixture baseline check

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact workflow-ref commit to verify
        required: true
        type: string
      inspection:
        description: Inspect an independently reviewed owner deployment without registering it
        required: true
        default: false
        type: boolean
      worker_version_id:
        description: Exact previously deployed Worker version from successful canary evidence
        required: false
        type: string
      source_sha:
        description: Exact reviewed source annotation from successful canary evidence
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: trace-production-fixture-baseline-check
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/feat/cloudflare-native-runtime' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-canary
    steps:
      - name: Validate exact workflow-ref SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The requested source must be a full 40-character hexadecimal commit SHA." >&2
            exit 1
          fi
          if [[ "${REQUESTED_SHA,,}" != "${DISPATCH_SHA,,}" ]]; then
            echo "The requested SHA must equal the workflow-ref dispatch SHA." >&2
            exit 1
          fi

      - name: Check out the workflow-ref source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify inspection source belongs to reviewed main history
        if: ${{ inputs.inspection }}
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD

      - name: Test production baseline verification contracts
        run: pnpm exec vitest run --project @trace/web apps/web/lib/production-canary-transition.test.ts

      - name: Verify production baseline read-only
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INSPECTION" == true ]]; then
            pnpm exec tsx scripts/verify-production-fixture-transition.ts inspect-reviewed-owner
          else
            pnpm exec tsx scripts/verify-production-fixture-transition.ts before
          fi
        env:
          INSPECTION: ${{ inputs.inspection }}
          REVIEWED_WORKER_VERSION_ID: ${{ inputs.worker_version_id }}
          REVIEWED_WORKER_SOURCE_SHA: ${{ inputs.source_sha }}
          TRACE_FIXTURE_D1_BASELINE_STAGE: ${{ github.ref == 'refs/heads/main' && 'owner' || 'before-oauth' }}
          TRACE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TRACE_GITHUB_APP_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TRACE_PRODUCTION_WORKER_NAME: ${{ vars.TRACE_PRODUCTION_WORKER_NAME }}
          TRACE_PRODUCTION_D1_ID: ${{ vars.TRACE_PRODUCTION_D1_ID }}
          TRACE_PRODUCTION_QUEUE_NAME: ${{ vars.TRACE_PRODUCTION_QUEUE_NAME }}
          TRACE_GITHUB_APP_ID: ${{ vars.TRACE_GITHUB_APP_ID }}
          TRACE_GITHUB_APP_CLIENT_ID: ${{ vars.TRACE_GITHUB_APP_CLIENT_ID }}
          TRACE_GITHUB_APP_SLUG: ${{ vars.TRACE_GITHUB_APP_SLUG }}
          TRACE_GITHUB_APP_CALLBACK_URL: ${{ vars.TRACE_GITHUB_APP_CALLBACK_URL }}
          TRACE_GITHUB_APP_INSTALL_URL: ${{ vars.TRACE_GITHUB_APP_INSTALL_URL }}
          TRACE_GITHUB_OAUTH_CLIENT_ID: ${{ vars.TRACE_GITHUB_OAUTH_CLIENT_ID }}
