name: TRACE production fixture baseline check

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact feature-ref commit to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trace-production-fixture-baseline-check
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/feat/cloudflare-native-runtime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-canary
    steps:
      - name: Validate exact feature-ref SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The requested source must be a full 40-character hexadecimal commit SHA." >&2
            exit 1
          fi
          if [[ "${REQUESTED_SHA,,}" != "${DISPATCH_SHA,,}" ]]; then
            echo "The requested SHA must equal the feature-ref dispatch SHA." >&2
            exit 1
          fi

      - name: Check out the feature-ref source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the closed production baseline read-only
        shell: bash
        run: pnpm exec tsx scripts/verify-production-fixture-transition.ts before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TRACE_PRODUCTION_WORKER_NAME: ${{ vars.TRACE_PRODUCTION_WORKER_NAME }}
          TRACE_PRODUCTION_D1_ID: ${{ vars.TRACE_PRODUCTION_D1_ID }}
          TRACE_PRODUCTION_QUEUE_NAME: ${{ vars.TRACE_PRODUCTION_QUEUE_NAME }}
          TRACE_GITHUB_APP_ID: ${{ vars.TRACE_GITHUB_APP_ID }}
          TRACE_GITHUB_APP_CLIENT_ID: ${{ vars.TRACE_GITHUB_APP_CLIENT_ID }}
          TRACE_GITHUB_APP_SLUG: ${{ vars.TRACE_GITHUB_APP_SLUG }}
          TRACE_GITHUB_APP_CALLBACK_URL: ${{ vars.TRACE_GITHUB_APP_CALLBACK_URL }}
          TRACE_GITHUB_APP_INSTALL_URL: ${{ vars.TRACE_GITHUB_APP_INSTALL_URL }}
          TRACE_GITHUB_OAUTH_CLIENT_ID: ${{ vars.TRACE_GITHUB_OAUTH_CLIENT_ID }}
