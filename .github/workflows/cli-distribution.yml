name: TRACE CLI distribution
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing CLI release tag to verify (empty builds a candidate)
        type: string
        required: false
      publish_release:
        description: Publish the tested archive as a GitHub CLI release (main only)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Validate publication request
        if: ${{ inputs.publish_release && (inputs.release_tag || github.ref != 'refs/heads/main') }}
        run: |
          echo 'Publication requires main and an empty release_tag; verification uses release_tag alone.' >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cli:pack
        if: ${{ !inputs.release_tag }}
      - name: Download published release for fresh acceptance
        if: ${{ inputs.release_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --pattern SHA256SUMS --dir dist/cli-release
      - uses: actions/upload-artifact@v4
        with:
          name: trace-cli-release
          path: dist/cli-release/
  acceptance:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve canonical scaffold bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: tooling
      - uses: actions/checkout@v4
        with:
          path: fresh-trace
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          package_json_file: tooling/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: tooling/pnpm-lock.yaml
      - uses: actions/download-artifact@v4
        with:
          name: trace-cli-release
          path: release
      - run: pnpm install --frozen-lockfile
        working-directory: tooling
      - run: pnpm --filter @trace/cli... build
        working-directory: tooling
      - run: pnpm --filter @trace/cli test:unit
        working-directory: tooling
      - name: Install release and analyze fresh TRACE checkout
        working-directory: tooling
        run: pnpm exec tsx scripts/test-cli-install.mts ../release ../fresh-trace
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main' && !inputs.release_tag }}
    needs: [package, acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trace-cli-release
          path: release
      - name: Publish only the archive accepted on Windows and Linux
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/trace-cli/package.json').version")"
          tag="cli-v${version}"
          archive="release/mathofdynamic-trace-cli-${version}.tgz"
          (cd release && sha256sum --check SHA256SUMS)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/trace-release.json"; then
            node -e "if (!require(process.argv[1]).isDraft) throw new Error('Refusing to overwrite a published CLI release')" "$RUNNER_TEMP/trace-release.json"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "TRACE CLI ${version}" --notes 'CLI distribution acceptance complete; assets uploading.'
          fi
          gh release upload "$tag" "$archive" release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          cp packages/trace-cli/README.md "$RUNNER_TEMP/trace-cli-release-notes.md"
          printf '\nSource: %s\nWindows/Linux acceptance: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/trace-cli-release-notes.md"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "TRACE CLI ${version}" --notes-file "$RUNNER_TEMP/trace-cli-release-notes.md" --draft=false
