name: TRACE production tail smoke

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character feature commit to inspect
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trace-production-tail-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: ${{ github.ref == 'refs/heads/feat/cloudflare-native-runtime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-canary
    env:
      EXPECTED_SHA: ${{ inputs.sha }}
    steps:
      - name: Validate exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The requested source must be a full 40-character hexadecimal SHA." >&2
            exit 1
          fi

      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Verify checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Checked-out source does not match the requested SHA." >&2
            exit 1
          fi
          echo "TAIL_SMOKE_SOURCE_SHA=$actual_sha"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Record Wrangler version
        shell: bash
        run: |
          set -euo pipefail
          wrangler_version="$(pnpm exec wrangler --version)"
          printf 'WRANGLER_VERSION=%s\n' "$wrangler_version"
          printf 'WRANGLER_VERSION=%s\n' "$wrangler_version" >> "$GITHUB_ENV"

      - name: Run focused tail harness tests
        run: pnpm exec vitest run --config apps/web/vitest.config.ts apps/web/lib/production-tail-observability.test.ts

      - name: Verify restored closed baseline and test both bounded tail forms
        shell: bash
        run: pnpm exec tsx scripts/production-tail-smoke.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TRACE_PRODUCTION_D1_ID: ${{ vars.TRACE_PRODUCTION_D1_ID }}
          TRACE_PRODUCTION_QUEUE_NAME: ${{ vars.TRACE_PRODUCTION_QUEUE_NAME }}
          TRACE_PRODUCTION_WORKER_NAME: ${{ vars.TRACE_PRODUCTION_WORKER_NAME }}
