name: TRACE production Queue drain check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trace-production-queue-drain-check
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.ref == 'refs/heads/feat/cloudflare-native-runtime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-canary
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read Queue identity and bounded realtime metrics
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const expectedAccountId = 'c5d6cf110905c91fc3eed1abaf8236a2';
          const queueId = '9ef092975a554ba296a63b162b16522f';
          const queueName = 'trace-production-jobs';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;

          if (!token) throw new Error('CLOUDFLARE_API_TOKEN is unavailable.');
          if (accountId !== expectedAccountId) {
            throw new Error('CLOUDFLARE_ACCOUNT_ID does not match the approved production account.');
          }

          const baseUrl = `https://api.cloudflare.com/client/v4/accounts/${accountId}/queues/${queueId}`;

          async function getResult(path) {
            let response;
            try {
              response = await fetch(`${baseUrl}${path}`, {
                method: 'GET',
                headers: { Authorization: `Bearer ${token}` },
                redirect: 'error',
                signal: AbortSignal.timeout(15000),
              });
            } catch {
              throw new Error('Cloudflare read-only GET failed before receiving a response.');
            }

            if (!response.ok) {
              throw new Error(`Cloudflare read-only GET returned HTTP ${response.status}.`);
            }

            let body;
            try {
              body = await response.json();
            } catch {
              throw new Error('Cloudflare read-only GET returned invalid JSON.');
            }

            if (
              !body ||
              body.success === false ||
              (Array.isArray(body.errors) && body.errors.length > 0) ||
              !body.result ||
              typeof body.result !== 'object'
            ) {
              throw new Error('Cloudflare read-only GET did not return a successful result.');
            }
            return body.result;
          }

          const queue = await getResult('');
          if (queue.queue_id !== queueId) throw new Error('Queue identity mismatch: queue_id.');
          if (queue.queue_name !== queueName) throw new Error('Queue identity mismatch: queue_name.');
          console.log(`Queue identity verified: ${queue.queue_name} (${queue.queue_id}).`);

          const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
          const optionalMetric = (value) =>
            typeof value === 'number' && Number.isFinite(value) ? String(value) : 'unavailable';

          let drained = false;
          for (let attempt = 1; attempt <= 3; attempt += 1) {
            const metrics = await getResult('/metrics');
            if (!Number.isSafeInteger(metrics.backlog_count) || metrics.backlog_count < 0) {
              throw new Error('Queue metrics validation failed: backlog_count must be a nonnegative integer.');
            }

            console.log(
              `Observation ${attempt} UTC ${new Date().toISOString()}: ` +
                `backlog_count=${metrics.backlog_count} ` +
                `backlog_bytes=${optionalMetric(metrics.backlog_bytes)} ` +
                `oldest_message_timestamp_ms=${optionalMetric(metrics.oldest_message_timestamp_ms)}`,
            );

            if (metrics.backlog_count === 0) {
              console.log('DRAIN STATUS: PASS (current backlog_count is 0).');
              drained = true;
              break;
            }

            if (attempt === 1) await wait(30000);
            else if (attempt === 2) await wait(60000);
          }

          if (!drained) {
            console.log('DRAIN STATUS: NOT DRAINED after three bounded observations.');
            process.exitCode = 1;
          }
          NODE
