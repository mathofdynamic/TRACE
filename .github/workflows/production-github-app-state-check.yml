name: TRACE production GitHub App state check

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character source commit to inspect
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trace-production-github-app-state-check
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.ref == 'refs/heads/feat/cloudflare-native-runtime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-canary
    env:
      EXPECTED_SHA: ${{ inputs.sha }}
    steps:
      - name: Validate exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The requested source must be a full 40-character hexadecimal commit SHA." >&2
            exit 1
          fi

      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1

      - name: Verify checkout matches the requested SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="${EXPECTED_SHA,,}"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "Checked-out SHA does not match the requested source." >&2
            exit 1
          fi
          echo "Source SHA: $actual_sha"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test read-only GitHub App state contract
        run: pnpm exec vitest run --project @trace/web apps/web/lib/verify-production-github-app-state.test.ts

      - name: Read GitHub App state
        shell: bash
        run: pnpm exec tsx scripts/verify-production-github-app-state.ts
        env:
          TRACE_GITHUB_APP_ID: ${{ vars.TRACE_GITHUB_APP_ID }}
          TRACE_GITHUB_APP_CLIENT_ID: ${{ vars.TRACE_GITHUB_APP_CLIENT_ID }}
          TRACE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TRACE_GITHUB_APP_PRIVATE_KEY }}
