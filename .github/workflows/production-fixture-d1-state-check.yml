name: TRACE production fixture D1 state check

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character source commit to inspect
        required: true
        type: string
      stage:
        description: Fixed read-only D1 acceptance state
        required: true
        type: choice
        options:
          - before-oauth
          - after-oauth
          - after-installation
      installation_id:
        description: External installation ID from the protected App verifier (post-install only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: trace-production-fixture-d1-state-check
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.ref == 'refs/heads/feat/cloudflare-native-runtime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-canary
    env:
      EXPECTED_SHA: ${{ inputs.sha }}
      FIXTURE_D1_STAGE: ${{ inputs.stage }}
      FIXTURE_INSTALLATION_ID: ${{ inputs.installation_id }}
    steps:
      - name: Validate exact feature-ref source SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The requested source must be a full 40-character hexadecimal commit SHA." >&2
            exit 1
          fi
          if [[ "${EXPECTED_SHA,,}" != "${GITHUB_SHA,,}" ]]; then
            echo "The requested SHA must match the feature-ref dispatch SHA." >&2
            exit 1
          fi
          case "$FIXTURE_D1_STAGE" in
            before-oauth|after-oauth|after-installation) ;;
            *) echo "Unsupported production fixture D1 stage." >&2; exit 1 ;;
          esac
          if [[ "$FIXTURE_D1_STAGE" == "after-installation" && ! "$FIXTURE_INSTALLATION_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo "Post-install verification requires the external installation ID." >&2
            exit 1
          fi

      - name: Check out the exact feature-ref source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checkout matches the requested SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha,,}" != "${EXPECTED_SHA,,}" ]]; then
            echo "Checked-out SHA does not match the requested source." >&2
            exit 1
          fi
          echo "Source SHA: $actual_sha"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test read-only D1 state contract
        run: pnpm exec vitest run --project @trace/web apps/web/lib/production-fixture-d1-state.test.ts

      - name: Verify production D1, foreign keys, Queue backlog, and health
        shell: bash
        run: pnpm exec tsx scripts/verify-production-fixture-d1-state.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TRACE_PRODUCTION_D1_ID: ${{ vars.TRACE_PRODUCTION_D1_ID }}
