name: TRACE canonical production Pages proxy
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact reviewed main source SHA
        required: true
        type: string
      mode:
        required: true
        type: choice
        options: [inspect, deploy]
      confirmation:
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: trace-production-pages-proxy
  cancel-in-progress: false
jobs:
  proxy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-canary
    env:
      EXPECTED_SHA: ${{ inputs.sha }}
      MODE: ${{ inputs.mode }}
      CONFIRMATION: ${{ inputs.confirmation }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate reviewed main and fixed account
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$CLOUDFLARE_ACCOUNT_ID" == c5d6cf110905c91fc3eed1abaf8236a2 ]]
          [[ "$MODE" == inspect || "$MODE" == deploy && "$CONFIRMATION" == DEPLOY_TRACE_CANONICAL_PAGES ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Inspect fixed existing Pages project and rollback identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec tsx scripts/inspect-production-pages.ts
      - name: Deploy only the fixed origin proxy
        if: ${{ inputs.mode == 'deploy' }}
        working-directory: deploy/pages-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" pages deploy public
          --project-name trace-code --branch main --commit-hash "$EXPECTED_SHA"
          --commit-message "TRACE canonical production proxy $EXPECTED_SHA"
      - name: Verify deployed Pages identity and anonymous production routes
        if: ${{ inputs.mode == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERIFY_PAGES_SOURCE: ${{ inputs.sha }}
        run: pnpm exec tsx scripts/inspect-production-pages.ts
