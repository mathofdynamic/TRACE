name: TRACE production fixture exact-version error tail

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character source commit to inspect
        required: true
        type: string

      worker_version_id:
        description: Exact production version captured by guarded deployment acceptance
        required: true
        default: 16055223-3a33-43a3-8d09-fafddb8abe72
        type: string

permissions:
  contents: read

concurrency:
  group: trace-production-fixture-error-tail
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.ref == 'refs/heads/feat/cloudflare-native-runtime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-canary
    env:
      EXPECTED_SHA: ${{ inputs.sha }}
    steps:
      - name: Validate exact feature-ref source SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The requested source must be a full 40-character hexadecimal commit SHA." >&2
            exit 1
          fi
          if [[ "${EXPECTED_SHA,,}" != "${GITHUB_SHA,,}" ]]; then
            echo "The requested SHA must match the feature-ref dispatch SHA." >&2
            exit 1
          fi

      - name: Check out the exact feature-ref source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checkout matches the requested SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha,,}" != "${EXPECTED_SHA,,}" ]]; then
            echo "Checked-out SHA does not match the requested source." >&2
            exit 1
          fi
          echo "Source SHA: $actual_sha"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the existing exact-version fixture tail contract
        run: pnpm exec vitest run --project @trace/web apps/web/lib/production-fixture-tail-acceptance.test.ts

      - name: Observe the pinned production fixture version without mutations
        shell: bash
        run: pnpm exec tsx scripts/production-fixture-tail-acceptance.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TRACE_GITHUB_OAUTH_CLIENT_ID: ${{ vars.TRACE_GITHUB_OAUTH_CLIENT_ID }}
          WORKER_VERSION_ID: ${{ inputs.worker_version_id }}
