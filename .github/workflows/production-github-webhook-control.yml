name: TRACE production GitHub webhook control

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character source commit to inspect
        required: true
        type: string

      operation:
        description: Fixed production fixture webhook operation
        required: true
        type: choice
        options:
          - configure
          - inspect-deliveries
          - redeliver
      delivery_id:
        description: Delivery ID from the protected bounded inspection (redeliver only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: trace-production-github-webhook-control
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.ref == 'refs/heads/feat/cloudflare-native-runtime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-canary
    env:
      EXPECTED_SHA: ${{ inputs.sha }}
      WEBHOOK_OPERATION: ${{ inputs.operation }}
      WEBHOOK_DELIVERY_ID: ${{ inputs.delivery_id }}
    steps:
      - name: Validate exact feature-ref source SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The requested source must be a full 40-character hexadecimal commit SHA." >&2
            exit 1
          fi
          if [[ "${EXPECTED_SHA,,}" != "${GITHUB_SHA,,}" ]]; then
            echo "The requested SHA must match the feature-ref dispatch SHA." >&2
            exit 1
          fi

          case "$WEBHOOK_OPERATION" in
            configure|inspect-deliveries) [[ -z "$WEBHOOK_DELIVERY_ID" ]] ;;
            redeliver) [[ "$WEBHOOK_DELIVERY_ID" =~ ^[1-9][0-9]{0,19}$ ]] ;;
            *) echo "Unsupported webhook operation." >&2; exit 1 ;;
          esac

      - name: Check out the exact feature-ref source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checkout matches the requested SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha,,}" != "${EXPECTED_SHA,,}" ]]; then
            echo "Checked-out SHA does not match the requested source." >&2
            exit 1
          fi
          echo "Source SHA: $actual_sha"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test fixture installation and webhook-control contracts
        run: pnpm exec vitest run --project @trace/web apps/web/lib/verify-production-github-fixture-installation.test.ts apps/web/lib/production-github-webhook-control.test.ts

      - name: Control the exact production fixture App webhook
        shell: bash
        run: pnpm exec tsx scripts/production-github-webhook-control.ts
        env:
          TRACE_GITHUB_APP_ID: ${{ vars.TRACE_GITHUB_APP_ID }}
          TRACE_GITHUB_APP_CLIENT_ID: ${{ vars.TRACE_GITHUB_APP_CLIENT_ID }}
          TRACE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TRACE_GITHUB_APP_PRIVATE_KEY }}
          TRACE_GITHUB_WEBHOOK_SECRET: ${{ secrets.TRACE_GITHUB_WEBHOOK_SECRET }}
