name: TRACE production owner catalog acceptance

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character source commit to inspect
        required: true
        type: string
      stage:
        description: Verify available owner catalog or selected real repository
        required: true
        type: choice
        options:
          - catalog
          - active

permissions:
  contents: read

concurrency:
  group: trace-production-owner-state-check
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.ref == 'refs/heads/feat/cloudflare-native-runtime' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-canary
    env:
      EXPECTED_SHA: ${{ inputs.sha }}
      OWNER_ACCEPTANCE_STAGE: ${{ inputs.stage }}
    steps:
      - name: Validate exact feature-ref source SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The requested source must be a full 40-character hexadecimal commit SHA." >&2
            exit 1
          fi
          if [[ "${EXPECTED_SHA,,}" != "${GITHUB_SHA,,}" ]]; then
            echo "The requested SHA must match the feature-ref dispatch SHA." >&2
            exit 1
          fi

      - name: Check out the exact feature-ref source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checkout matches the requested SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha,,}" != "${EXPECTED_SHA,,}" ]]; then
            echo "Checked-out SHA does not match the requested source." >&2
            exit 1
          fi
          echo "Source SHA: $actual_sha"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test read-only D1 state contract
        run: pnpm exec vitest run --project @trace/web apps/web/lib/production-owner-acceptance.test.ts

      - name: Verify production D1, foreign keys, Queue backlog, and health
        shell: bash
        run: pnpm exec tsx scripts/verify-production-owner-state.ts
        env:
          TRACE_GITHUB_APP_ID: ${{ vars.TRACE_GITHUB_APP_ID }}
          TRACE_GITHUB_APP_CLIENT_ID: ${{ vars.TRACE_GITHUB_APP_CLIENT_ID }}
          TRACE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TRACE_GITHUB_APP_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TRACE_PRODUCTION_D1_ID: ${{ vars.TRACE_PRODUCTION_D1_ID }}
